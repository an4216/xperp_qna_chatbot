<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/chat.css">
    <title>AI Chatbot</title>

    <!-- 로딩 애니메이션 최소 스타일 (원하면 chat.css로 이동) -->
    <style>
    </style>
</head>

<body>

    <div class="container">
        <header class="header">
            <nav>
                <div class="logo">
                    <a href="#" class="chat-home">
                        <img data-logo="aegisep" src="/static/images/aegis-logo.svg">
                    </a>
                    <span class="v_line"></span>
                    <img data-logo="xperp" src="/static/images/xperp-logo.svg">
                </div>
                <div class="homepage-link">
                    <a href="https://www.aegisep.com" target="_blank">공식 홈페이지 바로가기</a>
                </div>
            </nav>
        </header>

        <div class="main-content">
            <main class="chat-area">
                <div class="chat-container">

                    <div class="chat-content">
                        <div class="cover-content">
                            <h1> XpERP 상담 챗봇에 오신 것을 환영합니다.</h1>
                            <p>공동주택 관리 프로그램 XpERP의 사용법, 오류에 대해 궁금한 점이 있다면 언제든 문의해 주세요!</p>
                            <div class="cover-quesion-preview" aria-live="polite">
                                <div class="line">Q. 전출처리는 어떻게 하나요?</div>
                                <div class="line">Q. 입주민 차량 등록 방법이 궁금해요</div>
                                <div class="line">Q. 관리비 조회 방법을 알려주세요</div>
                            </div>
                        </div>
                    </div>

                </div>
                <div class="chat-input-area">
                    <div class="chat-input-wrapper">
                        <!-- ✅ input → textarea 로 변경, 클래스/구조 유지 -->
                        <textarea class="chat-input" rows="1" placeholder="XpERP 사용법이나 오류에 대해 물어보세요."
                            aria-label="챗봇 메시지 입력"></textarea>
                        <button class="send-button" aria-label="메시지 보내기">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-arrow-up w-5 h-5" aria-hidden="true"
                                style="color: rgb(255, 255, 255);">
                                <path d="m5 12 7-7 7 7"></path>
                                <path d="M12 19V5"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatContent = document.querySelector('.chat-content');
            const chatInput = document.querySelector('.chat-input');   // textarea
            const sendButton = document.querySelector('.send-button');
            const coverContent = document.querySelector('.cover-content');

            let hasSentFirstMessage = false;
            let isBusy = false; // ✅ 응답 대기중 플래그

            const addMessage = (sender, message) => {
                let html = '';
                if (sender === 'user') {
                    html = `<div class="user-message-container"><div class="user-message">${escapeHtml(message).replace(/\n/g, '<br>')}</div></div>`;
                } else {
                    html = `<div class="bot-message-container"><div class="bot-message">${message.replace(/\n/g, '<br>')}</div></div>`;
                }
                chatContent.insertAdjacentHTML('beforeend', html);

                // 질문일 때만 질문으로 스크롤
                if (sender === 'user') {
                    const lastUser = chatContent.querySelector('.user-message-container:last-of-type');
                    if (lastUser) {
                        const targetTop = lastUser.offsetTop - (chatContent.clientHeight / 2) + (lastUser.clientHeight / 2);
                        chatContent.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
                    }
                }
            };

            const escapeHtml = (s) =>
                s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            const autoResize = () => {
                chatInput.style.height = 'auto';
                chatInput.style.height = chatInput.scrollHeight + 'px';
            };

            const showLoading = () => {
                const wrapper = document.createElement('div');
                wrapper.className = 'bot-message-container';
                wrapper.innerHTML = `
          <div class="bot-message status-loading" role="status" aria-live="polite">
            <span class="sr-only">답변을 생성하는 중입니다...</span>
            <span class="loading-dots" aria-hidden="true">
              <span class="loading-dot"></span>
              <span class="loading-dot"></span>
              <span class="loading-dot"></span>
            </span>
          </div>
        `;
                chatContent.appendChild(wrapper);
                chatContent.scrollTo({ top: chatContent.scrollHeight, behavior: 'smooth' });
                return wrapper;
            };

            const removeLoading = (loadingEl) => {
                if (!loadingEl) return;
                if (typeof loadingEl.remove === 'function') loadingEl.remove();
                else if (loadingEl.parentNode) loadingEl.parentNode.removeChild(loadingEl);
            };

            // ✅ 입력/버튼 잠금/해제
            const lockInput = () => {
                isBusy = true;
                chatInput.disabled = true;
                sendButton.disabled = true;
                chatInput.classList.add('status-busy');
                sendButton.classList.add('status-busy');
                chatInput.setAttribute('aria-busy', 'true');
            };
            const unlockInput = () => {
                isBusy = false;
                chatInput.disabled = false;
                sendButton.disabled = false;
                chatInput.classList.remove('status-busy');
                sendButton.classList.remove('status-busy');
                chatInput.removeAttribute('aria-busy');
                chatInput.focus();
            };

            const handleSendMessage = async () => {
                if (isBusy) return; // ✅ 중복 전송 방지
                const raw = chatInput.value;
                const message = raw.trim();
                if (!message) return;

                if (!hasSentFirstMessage && coverContent) {
                    coverContent.style.display = 'none';
                    hasSentFirstMessage = true;
                }

                addMessage('user', raw);
                chatInput.value = '';
                autoResize();

                // ✅ 잠금 + 로딩 시작
                lockInput();
                const loadingEl = showLoading();

                try {
                    const formData = new FormData();
                    formData.append('message', message);

                    const response = await fetch('/chat', { method: 'POST', body: formData });
                    const botResponse = await response.text();

                    removeLoading(loadingEl);

                    if (!response.ok) {
                        addMessage('bot', `오류가 발생했어요 (${response.status}). 잠시 후 다시 시도해 주세요.`);
                        return;
                    }
                    addMessage('bot', botResponse);
                } catch (err) {
                    console.error(err);
                    removeLoading(loadingEl);
                    addMessage('bot', '오류가 발생했어요. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
                } finally {
                    // ✅ 해제
                    unlockInput();
                }
            };

            sendButton.addEventListener('click', handleSendMessage);

            // Enter=전송 / Shift+Enter|Ctrl+Enter=줄바꿈, busy면 입력 무시
            chatInput.addEventListener('keydown', (e) => {
                if (isBusy) {
                    // 입력 자체를 막고 싶으면 아래 주석 해제: e.preventDefault();
                    return;
                }
                if (e.key === 'Enter') {
                    const isShift = e.shiftKey;
                    const isCtrl = e.ctrlKey || e.metaKey;
                    if (!isShift && !isCtrl) {
                        e.preventDefault();
                        handleSendMessage();
                    }
                }
            });

            chatInput.addEventListener('input', autoResize);
            autoResize();

            document.querySelector('.chat-home')?.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.reload();
            });
        });
    </script>


</body>

</html>
