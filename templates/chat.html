<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatContent = document.querySelector('.chat-content');
        const chatInput = document.querySelector('.chat-input');
        const sendButton = document.querySelector('.send-button');
        const coverContent = document.querySelector('.cover-content');
        const resetButton = document.querySelector('.chat-home');

        let hasSentFirstMessage = false;

        const addMessage = (sender, message) => {
            let messageHtml = '';
            if (sender === 'user') {
                messageHtml = `<div class="user-message-container"><div class="user-message">${message}</div></div>`;
            } else {
                const formatted = message.replace(/\n/g, '<br>');
                messageHtml = `<div class="bot-message-container"><div class="bot-message">${formatted}</div></div>`;
            }
            chatContent.innerHTML += messageHtml;
            chatContent.scrollTop = chatContent.scrollHeight;
        };

        const handleSendMessage = async () => {
            const message = chatInput.value.trim();
            if (!message) return;

            // ✅ 처음 메시지 입력 시 cover-content 숨김
            if (!hasSentFirstMessage && coverContent) {
                // coverContent.classList.add('hidden');
                coverContent.style.display = 'none'; // display 속성도 제거
                hasSentFirstMessage = true;
            }

            // 사용자 메시지 추가 & 입력창 비우기
            addMessage('user', message);
            chatInput.value = '';

            // 로딩 메시지 추가
            addMessage('bot', '답변을 생성하는 중입니다...');

            // 마지막 봇 메시지(로딩 메시지) 안전 제거 함수
            const removeLastBotMessage = () => {
                const botMessages = document.querySelectorAll('.bot-message-container');
                const count = botMessages.length;
                if (count > 0) {
                    const last = botMessages[count - 1];
                    if (last && typeof last.remove === 'function') {
                        last.remove();
                    } else if (last && last.parentNode) {
                        last.parentNode.removeChild(last);
                    }
                }
            };

            try {
                const formData = new FormData();
                formData.append('message', message);

                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const botResponse = await response.text();

                // 로딩 메시지 제거
                removeLastBotMessage();

                // HTTP 오류 처리(텍스트는 이미 받아왔으니 우선 ok 여부로 fallback)
                if (!response.ok) {
                    addMessage('bot', `오류가 발생했어요 (${response.status}). 잠시 후 다시 시도해 주세요.`);
                    return;
                }

                // 실제 봇 응답 추가
                addMessage('bot', botResponse);
            } catch (err) {
                console.error(err);
                // 로딩 메시지 제거 후 에러 메시지 출력
                removeLastBotMessage();
                addMessage('bot', '오류가 발생했어요. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.');
            }
        };


        sendButton.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });


    });
</script>
