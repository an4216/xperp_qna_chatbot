<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/images/xperp-favicon.png">
  <link rel="stylesheet" href="/static/css/chat.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <title>XpERP Chatbot</title>
</head>

<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header">
      <nav>
        <div class="logo">
          <a href="#" class="chat-home">
            <img data-logo="aegisep" src="/static/images/aegis-logo.svg">
          </a>
          <span class="v_line"></span>
          <img data-logo="xperp" src="/static/images/xperp-logo.svg">
        </div>
      </nav>
    </header>

    <!-- 본문 -->
    <div class="main-content">
      <!-- 사이드바 (대화 목록) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <button class="new-chat-button" onclick="createNewConversation()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>새 대화</span>
          </button>
        </div>
        <div class="conversation-list" id="conversationList">
          <!-- 대화 목록이 여기에 동적으로 추가됩니다 -->
        </div>
      </aside>

      <main class="chat-area">
        <div class="chat-container">
          <div class="chat-content">
            <div class="cover-content">
              <h1>XpERP 상담 챗봇에 오신 것을 환영합니다.</h1>
              <p>공동주택 관리 프로그램 XpERP의 사용법, 오류에 대해 궁금한 점이 있다면 언제든 문의해 주세요!</p>
              <div class="cover-quesion-preview" aria-live="polite">
                <div class="line">Q. 전출처리는 어떻게 하나요?</div>
                <div class="line">Q. 입주민 차량 등록 방법이 궁금해요</div>
                <div class="line">Q. 관리비 조회 방법을 알려주세요</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 입력창 -->
        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea class="chat-input" rows="1" placeholder="XpERP 사용법이나 오류에 대해 물어보세요."
              aria-label="챗봇 메시지 입력"></textarea>
            <button class="send-button" aria-label="메시지 보내기"></button>
          </div>
          <p class="chat-input-desc">
            AI의 상담 내용은 참고용이며, 중요한 정보는 다시 한번 확인해 주세요.
          </p>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div id="customModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
      </div>
      <div class="modal-body">
        <p id="modalMessage"></p>
      </div>
      <div class="modal-footer">
        <button id="modalCancelBtn" class="modal-btn modal-btn-cancel">취소</button>
        <button id="modalConfirmBtn" class="modal-btn modal-btn-confirm">확인</button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // 모달 함수
    // ============================================
    function showAlert(message, title = '알림') {
      return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        modalTitle.textContent = title;
        modalMessage.innerHTML = message.replace(/\n/g, '<br>');

        // alert 모드: 확인 버튼만 표시
        cancelBtn.style.display = 'none';
        confirmBtn.style.display = 'block';
        confirmBtn.textContent = '확인';

        modal.style.display = 'flex';

        const handleConfirm = () => {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', handleConfirm);
          resolve(true);
        };

        confirmBtn.addEventListener('click', handleConfirm);
      });
    }

    function showConfirm(message, title = '확인') {
      return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const confirmBtn = document.getElementById('modalConfirmBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        modalTitle.textContent = title;
        modalMessage.innerHTML = message.replace(/\n/g, '<br>');

        // confirm 모드: 취소/확인 버튼 모두 표시
        cancelBtn.style.display = 'block';
        confirmBtn.style.display = 'block';
        confirmBtn.textContent = '확인';

        modal.style.display = 'flex';

        const handleConfirm = () => {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', handleConfirm);
          cancelBtn.removeEventListener('click', handleCancel);
          resolve(true);
        };

        const handleCancel = () => {
          modal.style.display = 'none';
          confirmBtn.removeEventListener('click', handleConfirm);
          cancelBtn.removeEventListener('click', handleCancel);
          resolve(false);
        };

        confirmBtn.addEventListener('click', handleConfirm);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // ============================================
      // userId 파라미터 검증 (클라이언트 측 보안)
      // ============================================
      const urlParams = new URLSearchParams(window.location.search);
      const userId = urlParams.get('userId');

      // userId가 없으면 접근 차단
      if (!userId) {
        showAlert('접근이 거부되었습니다.', '오류').then(() => {
          window.close();
          // window.close()가 작동하지 않을 경우 빈 페이지로 리디렉션
          setTimeout(() => {
            document.body.innerHTML = '<div style="text-align:center;margin-top:50px;"><h2>접근이 거부되었습니다</h2></div>';
          }, 100);
        });
        return;
      }

      // userId 길이 검증
      if (userId.length < 3 || userId.length > 50) {
        showAlert('접근이 거부되었습니다.', '오류').then(() => {
          window.close();
          setTimeout(() => {
            document.body.innerHTML = '<div style="text-align:center;margin-top:50px;"><h2>접근이 거부되었습니다</h2></div>';
          }, 100);
        });
        return;
      }

      console.log('[INFO] 챗봇 시작: userId=' + userId);

      const chatContainer = document.querySelector('.chat-container');
      const chatContent = document.querySelector('.chat-content');
      const chatInput = document.querySelector('.chat-input');
      const sendButton = document.querySelector('.send-button');
      const coverContent = document.querySelector('.cover-content');

      let hasSentFirstMessage = false;
      let isBusy = false;
      let lastUserMessage = "";
      let currentConversationId = null;

      // chatId 생성 시 userId 포함
      let chatId = localStorage.getItem('chat_id_' + userId);
      if (!chatId) {
        chatId = userId + '_' + (Date.now() + '_' + Math.random().toString(16).slice(2));
        localStorage.setItem('chat_id_' + userId, chatId);
      }
      // 새로고침 시 대화 내용이 로드되지 않은 상태에서 currentConversationId를 설정하지 않음
      // 사용자가 대화를 클릭하면 switchConversation에서 설정됨

      // ✅ 홈 버튼 클릭 시 세션 초기화 후 리로드
      document.querySelector('.chat-home')?.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('chat_id_' + userId);  // 세션 클리어 (userId 포함)
        window.location.reload();
      });

      const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) =>
              ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
      );

      const autoResize = () => {
        chatInput.style.height = 'auto';
        chatInput.style.height = chatInput.scrollHeight + 'px';
      };

      const lockInput = () => {
        isBusy = true;
        sendButton.disabled = true;
        sendButton.classList.add('status-busy');
        chatInput.setAttribute('aria-busy', 'true');
      };

      const unlockInput = () => {
        isBusy = false;
        sendButton.classList.remove('status-busy');
        chatInput.removeAttribute('aria-busy');
        chatInput.focus();
        updateSendButtonState();
      };

      const updateSendButtonState = () => {
        sendButton.disabled = !chatInput.value.trim();
      };

      const scrollToBottom = () => {
        chatContainer.scrollTo({
          top: chatContainer.scrollHeight,
          behavior: 'smooth'
        });
      };

      const addMessage = (sender, message) => {
        let html = '';
        if (sender === 'user') {
          html = `<div class="user-message-container"><div class="user-message">${escapeHtml(message).replace(/\n/g, '<br>')}</div></div>`;
          chatContent.insertAdjacentHTML('beforeend', html);
          scrollToBottom();
        }
      };

      const handleSendMessage = async () => {
        if (isBusy) return;

        const raw = chatInput.value;
        const message = raw.trim();
        if (!message) return;

        // 환영 화면 완전히 제거 (위로 밀리지 않도록)
        if (!hasSentFirstMessage) {
          const cover = document.querySelector('.cover-content');
          if (cover) {
            cover.remove();
          }
          hasSentFirstMessage = true;
        }

        addMessage('user', raw);
        chatInput.value = '';
        autoResize();
        lastUserMessage = message;

        lockInput();

        try {
          const formData = new FormData();
          formData.append('message', message);
          formData.append('session_id', chatId);
          formData.append('user_id', userId);  // userId를 API에 전송

          const wrapper = document.createElement('div');
          const msgId = Date.now();
          wrapper.className = 'bot-message-container';
          wrapper.dataset.msgId = msgId;

          // 메시지 전송 시 대화 목록 갱신 체크 (첫 메시지일 경우)
          const isFirstMessageInSession = !hasSentFirstMessage;

          const botDiv = document.createElement('div');
          botDiv.className = 'bot-message status-loading';

          const loadingEl = document.createElement('span');
          loadingEl.className = 'loading-dots';
          loadingEl.innerHTML = `
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
          <span class="loading-dot"></span>
        `;
          botDiv.appendChild(loadingEl);
          wrapper.appendChild(botDiv);
          chatContent.appendChild(wrapper);
          scrollToBottom();

          await new Promise(requestAnimationFrame);

          const response = await fetch('/chat', {
            method: 'POST',
            body: formData
          });

          if (!response.ok) {
            botDiv.classList.remove('status-loading');
            if (loadingEl) loadingEl.remove();

            // 서버에서 보낸 에러 메시지 읽기
            try {
              const errorMessage = await response.text();
              botDiv.textContent = errorMessage || `오류 발생 (${response.status})`;
            } catch (err) {
              botDiv.textContent = `오류 발생 (${response.status})`;
            }
            return;
          }

          if (!response.body) {
            botDiv.classList.remove('status-loading');
            if (loadingEl) loadingEl.remove();
            botDiv.textContent = '응답을 받을 수 없습니다.';
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let botMessage = '';
          let isFirstChunk = true;

          while (true) {
            const { done, value } = await reader.read();
            if (done) {
              botDiv.classList.remove('status-loading');
              const lastP = botDiv.querySelector('p:last-of-type');
              if (lastP && lastP.textContent.includes('소요시간')) {
                lastP.classList.add('elapsed');
              }
              break;
            }

            if (isFirstChunk) {
              botDiv.classList.remove('status-loading');
              if (loadingEl) loadingEl.remove();
              isFirstChunk = false;
            }

            const chunk = decoder.decode(value, { stream: true });

            // ✅ UUID 추출 로직 - wrapper에 data attribute로 저장
            if (chunk.includes('__UUID:')) {
              const uuidMatch = chunk.match(/__UUID:([a-f0-9-]+)/);
              if (uuidMatch) {
                const uuid = uuidMatch[1];
                wrapper.dataset.conversationUuid = uuid;  // ✅ 각 메시지 컨테이너에 UUID 저장
                console.log('Conversation UUID:', uuid);
                // UUID 부분은 화면에 표시하지 않음
                continue;
              }
            }

            botMessage += chunk;
            botDiv.innerHTML = marked.parse(botMessage);
            scrollToBottom();
          }

          // 첫 메시지 전송 후 대화 목록 갱신
          if (isFirstMessageInSession) {
            setTimeout(loadConversations, 1500);
          }

          // ✅ 피드백 박스 추가
          const feedbackBox = document.createElement('div');
          feedbackBox.className = 'feedback-box';
          feedbackBox.innerHTML = `
          <div class="feedback-buttons">
            <button class="icon-button" aria-label="좋아요">
              <span class="like-icon"></span>
            </button>
            <button class="icon-button" data-role="dislike" aria-label="개선이 필요해요">
              <span class="dislike-icon"></span>
            </button>
            <button class="icon-button copy-button" data-role="copy" aria-label="답변 복사">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
          <div class="feedback-form" style="display: none;">
            <p class="feedback-title">(필수)이름 입력</p>
            <div class="feedback-input-box">
              <input type="text" class="feedback-input" placeholder="이름을 입력해주세요.">
            </div>
            <p class="feedback-title">어떤 점이 불만족스러우셨나요?</p>
            <div class="feedback-options">
              <button class="option-button">버그가 있어요.</button>
              <button class="option-button">내용이 부정확해요.</button>
              <button class="option-button">중복되거나 반복적인 설명이에요.</button>
              <button class="option-button">답변이 너무 짧거나 성의없어 보여요.</button>
              <button class="option-button">답변이 너무 길거나 불필요하게 장황해요.</button>
              <button class="option-button">업무에 적용하기 어려운 답변이에요.</button>
              <button class="option-button">기타(의견을 작성해주세요)</button>
            </div>
            <div class="feedback-comment-box">
              <textarea class="feedback-textarea" placeholder="의견을 입력해 주세요" style="display:none;"></textarea>
              <div class="feedback-actions">
                <button class="btn-cancel">취소</button>
                <button class="btn-submit" disabled>제출</button>
              </div>
            </div>
          </div>
        `;
          wrapper.appendChild(feedbackBox);
          scrollToBottom();

        } catch (err) {
          console.error(err);
          const lastBot = chatContent.querySelector('.bot-message.status-loading');
          if (lastBot) lastBot.classList.remove('status-loading');
          addMessage('bot', '오류 발생. 네트워크 확인 후 다시 시도해주세요.');
        } finally {
          unlockInput();
        }
      };

      // 피드백 이벤트
      chatContent.addEventListener('click', async (e) => {
        const target = e.target;
        const box = target.closest('.feedback-box');
        if (!box) return;
        const wrapper = target.closest('.bot-message-container');
        const responseText = wrapper.querySelector('.bot-message')?.innerText || '';

        const likeButton = box.querySelector('[aria-label="좋아요"]');
        const dislikeButton = box.querySelector('[data-role="dislike"]');

        if (target.closest('.like-icon')) {
          if (likeButton.classList.contains('status-selected')) return;

          const form = box.querySelector('.feedback-form');
          const textarea = box.querySelector('.feedback-textarea');
          const selected = box.querySelector('.option-button.selected');

          if (form) form.style.display = 'none';
          if (textarea) textarea.value = '';
          if (selected) selected.classList.remove('selected');
          updateSubmitState(box);

          box.querySelectorAll('.icon-button').forEach(btn => {
            btn.classList.remove('status-selected');
            btn.disabled = true;
          });
          likeButton.classList.add('status-selected');
          if (dislikeButton) dislikeButton.remove();

          // ✅ wrapper에서 UUID 읽기
          const conversationUuid = wrapper.dataset.conversationUuid;
          if (!conversationUuid) {
            console.error("UUID가 없어 피드백을 전송할 수 없습니다.");
            return;
          }

          const payload = {
            conversation_uuid: conversationUuid,  // ✅ UUID 포함
            message: lastUserMessage,
            response: responseText,
            feedback: "up",
            name: "",  // ✅ up 피드백은 이름 없음
            timestamp: new Date().toISOString()
          };
          try {
            await fetch('/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
          } catch (err) {
            console.error("좋아요 전송 실패", err);
          }
        }

        if (target.closest('.dislike-icon')) {
          dislikeButton.classList.add('status-selected');
          likeButton.classList.remove('status-selected');
          const form = box.querySelector('.feedback-form');
          form.style.display = 'block';
        }

        if (target.classList.contains('option-button')) {
          const buttons = box.querySelectorAll('.option-button');
          buttons.forEach(btn => btn.classList.remove('selected'));
          target.classList.add('selected');

          const textarea = box.querySelector('.feedback-textarea');
          if (textarea) {
            if (target.innerText.includes('기타')) {
              textarea.style.display = 'block';
            } else {
              textarea.style.display = 'none';
              textarea.value = '';
            }
          }
          updateSubmitState(box);
        }

        if (target.classList.contains('feedback-textarea')) {
          target.addEventListener('input', () => updateSubmitState(box), { once: true });
        }

        if (target.classList.contains('btn-submit')) {
          const selected = box.querySelector('.option-button.selected');
          const textarea = box.querySelector('.feedback-textarea');
          const nameInput = box.querySelector('.feedback-input');
          const reason = selected ? selected.innerText : '';
          const comment = textarea.value.trim();
          const name = nameInput ? nameInput.value.trim() : "";

          if (!name) {
            showAlert("이름을 입력해주세요.", "입력 오류");
            return;
          }

          if (!reason && comment.length < 10) {
            showAlert("의견을 최소 10자 이상 입력하거나 사유를 선택해주세요.", "입력 오류");
            return;
          }

          // ✅ wrapper에서 UUID 읽기
          const conversationUuid = wrapper.dataset.conversationUuid;
          if (!conversationUuid) {
            console.error("UUID가 없어 피드백을 전송할 수 없습니다.");
            showAlert("피드백을 전송할 수 없습니다. 페이지를 새로고침하고 다시 시도해주세요.", "오류");
            return;
          }

          let displayReason = reason;
          if (reason.includes('기타')) {
            let shortComment = comment;
            if (shortComment.length > 10) {
              shortComment = shortComment.substring(0, 20) + "...";
            }
            displayReason = `기타 (${shortComment})`;
          }

          const payload = {
            conversation_uuid: conversationUuid,  // ✅ UUID 포함
            message: lastUserMessage,
            response: responseText,
            feedback: "down",
            reason,
            comment,
            name,
            timestamp: new Date().toISOString()
          };

          try {
            await fetch('/feedback', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            const form = box.querySelector('.feedback-form');
            if (form) form.style.display = 'none';

            const optionButtons = box.querySelectorAll('.option-button');
            optionButtons.forEach(btn => btn.disabled = true);

            const feedbackTextarea = box.querySelector('.feedback-textarea');
            if (feedbackTextarea) feedbackTextarea.disabled = true;

            const cancelBtn = box.querySelector('.btn-cancel');
            if (cancelBtn) cancelBtn.disabled = true;

            const submitBtn = box.querySelector('.btn-submit');
            if (submitBtn) submitBtn.disabled = true;

            const nameField = box.querySelector('.feedback-input');
            if (nameField) nameField.disabled = true;

            const resultBox = document.createElement('div');
            resultBox.className = 'feedback-result-box';
            resultBox.innerHTML = `
            <div class="feedback-selected">
              <p id="feedbackSeletText">${displayReason}</p>
            </div>
            <div class="feedback-result">
              <p class="feedback-thanks">소중한 의견 감사합니다. (${name}님)</p>
              <button type="button" class="btn-close">닫기</button>
            </div>
          `;
            box.appendChild(resultBox);
          } catch (err) {
            console.error("비추 전송 실패", err);
          }
        }

        if (target.classList.contains('btn-cancel')) {
          const form = box.querySelector('.feedback-form');
          const textarea = box.querySelector('.feedback-textarea');
          const selected = box.querySelector('.option-button.selected');
          const dislikeButton = box.querySelector('[data-role="dislike"]');

          form.style.display = 'none';
          if (textarea) textarea.value = '';
          if (selected) selected.classList.remove('selected');

          if (dislikeButton) {
            dislikeButton.classList.remove('status-selected');
            dislikeButton.disabled = false;
          }
          updateSubmitState(box);
        }

        if (target.classList.contains('btn-close')) {
          const resultBox = box.querySelector('.feedback-result-box');
          if (resultBox) resultBox.remove();
        }

        // 복사 버튼 클릭
        if (target.closest('[data-role="copy"]')) {
          const copyButton = target.closest('[data-role="copy"]');
          const botMessage = wrapper.querySelector('.bot-message');

          if (botMessage) {
            // 텍스트만 추출 (마크다운 HTML 제거)
            const textContent = botMessage.innerText;

            // 복사 함수 (HTTPS/HTTP 모두 지원)
            const copyToClipboard = (text) => {
              // HTTPS 또는 localhost인 경우 Clipboard API 사용
              if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text);
              } else {
                // HTTP인 경우 fallback 메서드 사용
                return new Promise((resolve, reject) => {
                  const textarea = document.createElement('textarea');
                  textarea.value = text;
                  textarea.style.position = 'fixed';
                  textarea.style.left = '-999999px';
                  textarea.style.top = '-999999px';
                  document.body.appendChild(textarea);
                  textarea.focus();
                  textarea.select();

                  try {
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    if (successful) {
                      resolve();
                    } else {
                      reject(new Error('복사 명령 실패'));
                    }
                  } catch (err) {
                    document.body.removeChild(textarea);
                    reject(err);
                  }
                });
              }
            };

            // 클립보드에 복사
            copyToClipboard(textContent).then(() => {
              // 복사 성공 피드백
              const originalHTML = copyButton.innerHTML;
              copyButton.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              `;
              copyButton.classList.add('copied');

              // 2초 후 원래 아이콘으로 복귀
              setTimeout(() => {
                copyButton.innerHTML = originalHTML;
                copyButton.classList.remove('copied');
              }, 2000);
            }).catch(err => {
              console.error('복사 실패:', err);
              showAlert('복사에 실패했습니다.', '오류');
            });
          }
        }
      });

      const updateSubmitState = (box) => {
        const textarea = box.querySelector('.feedback-textarea');
        const selected = box.querySelector('.option-button.selected');
        const submitBtn = box.querySelector('.btn-submit');
        const hasText = textarea && textarea.value.trim().length >= 10;
        const hasOption = !!selected;
        submitBtn.disabled = !(hasOption || hasText);
      };

      sendButton.addEventListener('click', handleSendMessage);
      chatInput.addEventListener('keydown', (e) => {
        if (isBusy) return;
        if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      chatInput.addEventListener('input', () => {
        autoResize();
        updateSendButtonState();
      });

      autoResize();
      updateSendButtonState();

      // ============================================
      // 대화 목록 관련 함수
      // ============================================

      // 대화 목록 로드
      async function loadConversations() {
        try {
          const response = await fetch(`/conversations?user_id=${userId}`);
          const data = await response.json();

          if (data.status === 'ok' && data.conversations) {
            renderConversations(data.conversations);
          }
        } catch (err) {
          console.error('대화 목록 로드 실패:', err);
        }
      }

      // 대화 목록 렌더링
      function renderConversations(conversations) {
        const listEl = document.getElementById('conversationList');
        listEl.innerHTML = '';

        if (conversations.length === 0) {
          listEl.innerHTML = '<div class="empty-conversations">대화 내역이 없습니다</div>';
          return;
        }

        conversations.forEach(conv => {
          const item = document.createElement('div');
          item.className = 'conversation-item';
          item.dataset.conversationId = conv.conversation_id;
          if (conv.conversation_id === currentConversationId) {
            item.classList.add('active');
          }

          const title = conv.first_message || '새 대화';
          const preview = title.length > 30 ? title.substring(0, 30) + '...' : title;

          const date = new Date(conv.updated_at);
          const timeAgo = getTimeAgo(date);

          item.innerHTML = `
            <div class="conversation-content" data-conversation-id="${conv.conversation_id}">
              <div class="conversation-title">
                <span class="title-text">${escapeHtml(preview)}</span>
                <button class="delete-conversation-btn" data-conversation-id="${conv.conversation_id}" title="대화 삭제">−</button>
              </div>
              <div class="conversation-info">
                <span class="message-count">${conv.message_count}개 메시지</span>
                <span class="conversation-time">${timeAgo}</span>
              </div>
            </div>
          `;

          // 대화 내용 클릭 시 대화 전환
          const contentDiv = item.querySelector('.conversation-content');
          contentDiv.onclick = () => switchConversation(conv.conversation_id);

          // 삭제 버튼 클릭 이벤트
          const deleteBtn = item.querySelector('.delete-conversation-btn');
          deleteBtn.onclick = (e) => {
            e.stopPropagation(); // 대화 전환 방지
            deleteConversation(conv.conversation_id);
          };

          listEl.appendChild(item);
        });
      }

      // 활성 대화 표시 업데이트
      function updateActiveConversation() {
        document.querySelectorAll('.conversation-item').forEach(item => {
          if (item.dataset.conversationId === currentConversationId) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
      }

      // 시간 표시 (상대 시간)
      function getTimeAgo(date) {
        const now = new Date();
        const diff = now - date;
        const minutes = Math.floor(diff / 60000);
        const hours = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);

        if (minutes < 1) return '방금 전';
        if (minutes < 60) return `${minutes}분 전`;
        if (hours < 24) return `${hours}시간 전`;
        if (days < 7) return `${days}일 전`;
        return date.toLocaleDateString('ko-KR');
      }

      // 새 대화 생성
      window.createNewConversation = async function() {
        // 새 chatId 생성
        chatId = userId + '_' + (Date.now() + '_' + Math.random().toString(16).slice(2));
        localStorage.setItem('chat_id_' + userId, chatId);
        currentConversationId = chatId;

        // 화면 초기화 (환영 메시지 표시하지 않음)
        chatContent.innerHTML = '';
        hasSentFirstMessage = false;
        chatInput.value = '';
        chatInput.focus();

        // 대화 목록의 활성 상태 제거 (아직 목록에는 추가하지 않음)
        document.querySelectorAll('.conversation-item').forEach(item => {
          item.classList.remove('active');
        });

        // 첫 메시지 전송 시 loadConversations()가 호출되어 자동으로 목록에 추가됨
      };

      // 대화 삭제
      async function deleteConversation(conversationId) {
        const confirmed = await showConfirm('이 대화를 삭제하시겠습니까?\n삭제된 대화는 복구할 수 없습니다.', '대화 삭제');
        if (!confirmed) {
          return;
        }

        try {
          const response = await fetch(`/conversation/${conversationId}?user_id=${userId}`, {
            method: 'DELETE'
          });
          const data = await response.json();

          if (data.status === 'ok') {
            // 삭제된 대화가 현재 보고 있는 대화인 경우 화면 초기화
            if (conversationId === currentConversationId) {
              chatContent.innerHTML = '';
              currentConversationId = null;

              // 새 대화 생성
              await createNewConversation();
            }

            // 대화 목록 새로고침
            await loadConversations();
          } else {
            showAlert('대화 삭제에 실패했습니다: ' + (data.message || '알 수 없는 오류'), '오류');
          }
        } catch (err) {
          console.error('대화 삭제 실패:', err);
          showAlert('대화 삭제 중 오류가 발생했습니다.', '오류');
        }
      }

      // 대화 전환
      async function switchConversation(conversationId) {
        if (conversationId === currentConversationId) {
          return; // 이미 현재 대화
        }

        try {
          // API에서 메시지 로드
          const response = await fetch(`/conversation/${conversationId}/messages?user_id=${userId}`);
          const data = await response.json();

          if (data.status !== 'ok' || !data.messages) {
            showAlert('대화를 불러올 수 없습니다.', '오류');
            return;
          }

          // 화면 초기화
          chatContent.innerHTML = '';

          // 메시지들 렌더링
          data.messages.forEach(msg => {
            // 사용자 메시지 추가
            const userHtml = `<div class="user-message-container"><div class="user-message">${escapeHtml(msg.message).replace(/\n/g, '<br>')}</div></div>`;
            chatContent.insertAdjacentHTML('beforeend', userHtml);

            // 봇 응답 추가
            const wrapper = document.createElement('div');
            wrapper.className = 'bot-message-container';

            // UUID 저장 (피드백 제출용)
            if (msg.uuid) {
              wrapper.dataset.conversationUuid = msg.uuid;
            }

            const botDiv = document.createElement('div');
            botDiv.className = 'bot-message';
            botDiv.innerHTML = marked.parse(msg.response);
            wrapper.appendChild(botDiv);

            // 피드백 버튼 영역 추가
            const feedbackBox = document.createElement('div');
            feedbackBox.className = 'feedback-box';
            feedbackBox.innerHTML = `
              <div class="feedback-buttons">
                <button class="icon-button" aria-label="좋아요">
                  <span class="like-icon"></span>
                </button>
                <button class="icon-button" data-role="dislike" aria-label="개선이 필요해요">
                  <span class="dislike-icon"></span>
                </button>
                <button class="icon-button copy-button" data-role="copy" aria-label="답변 복사">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
              </div>
              <div class="feedback-form" style="display: none;">
                <p class="feedback-title">(필수)이름 입력</p>
                <div class="feedback-input-box">
                  <input type="text" class="feedback-input" placeholder="이름을 입력해주세요.">
                </div>
                <p class="feedback-title">어떤 점이 불만족스러우셨나요?</p>
                <div class="feedback-options">
                  <button class="option-button">버그가 있어요.</button>
                  <button class="option-button">내용이 부정확해요.</button>
                  <button class="option-button">중복되거나 반복적인 설명이에요.</button>
                  <button class="option-button">답변이 너무 짧거나 성의없어 보여요.</button>
                  <button class="option-button">답변이 너무 길거나 불필요하게 장황해요.</button>
                  <button class="option-button">업무에 적용하기 어려운 답변이에요.</button>
                  <button class="option-button">기타(의견을 작성해주세요)</button>
                </div>
                <div class="feedback-comment-box">
                  <textarea class="feedback-textarea" placeholder="의견을 입력해 주세요" style="display:none;"></textarea>
                  <div class="feedback-actions">
                    <button class="btn-cancel">취소</button>
                    <button class="btn-submit" disabled>제출</button>
                  </div>
                </div>
              </div>
            `;
            wrapper.appendChild(feedbackBox);

            // 피드백 상태에 따라 버튼 상태 설정
            const likeButton = feedbackBox.querySelector('[aria-label="좋아요"]');
            const dislikeButton = feedbackBox.querySelector('[data-role="dislike"]');
            const feedbackForm = feedbackBox.querySelector('.feedback-form');

            if (msg.feedback === 'up') {
              // 좋아요가 이미 눌린 경우
              likeButton.classList.add('status-selected');
              feedbackBox.querySelectorAll('.icon-button').forEach(btn => {
                btn.disabled = true;
              });
              if (dislikeButton) dislikeButton.remove();
            } else if (msg.feedback === 'down') {
              // 개선 필요가 이미 눌린 경우
              dislikeButton.classList.add('status-selected');
              feedbackBox.querySelectorAll('.icon-button').forEach(btn => {
                btn.disabled = true;
              });
              likeButton.remove();

              // 상세 피드백 표시 (읽기 전용)
              if (msg.reason || msg.comment) {
                feedbackForm.style.display = 'block';
                const nameInput = feedbackForm.querySelector('.feedback-input');
                const textarea = feedbackForm.querySelector('.feedback-textarea');
                const submitBtn = feedbackForm.querySelector('.btn-submit');
                const cancelBtn = feedbackForm.querySelector('.btn-cancel');

                // 읽기 전용 모드로 설정
                if (nameInput) nameInput.style.display = 'none';
                feedbackForm.querySelector('.feedback-title').textContent = '제출된 피드백';

                if (msg.reason) {
                  const reasonButton = Array.from(feedbackForm.querySelectorAll('.option-button'))
                    .find(btn => btn.textContent === msg.reason);
                  if (reasonButton) {
                    reasonButton.classList.add('selected');
                    reasonButton.disabled = true;
                  }
                }

                if (msg.comment) {
                  textarea.style.display = 'block';
                  textarea.value = msg.comment;
                  textarea.disabled = true;
                }

                // 버튼 숨기기
                submitBtn.style.display = 'none';
                cancelBtn.style.display = 'none';
              }
            }
            // feedback === null인 경우 버튼은 기본 활성화 상태 (이미 그렇게 렌더링됨)

            chatContent.appendChild(wrapper);
          });

          // chatId 업데이트
          chatId = conversationId;
          currentConversationId = conversationId;
          localStorage.setItem('chat_id_' + userId, chatId);

          // 첫 메시지 상태 업데이트
          hasSentFirstMessage = data.messages.length > 0;

          // 대화 목록에서 활성 상태 업데이트
          updateActiveConversation();

          // 스크롤을 맨 아래로
          scrollToBottom();

        } catch (err) {
          console.error('대화 전환 실패:', err);
          showAlert('대화를 불러오는 중 오류가 발생했습니다.', '오류');
        }
      }

      // 페이지 로드 시 대화 목록 로드
      loadConversations();
    });

    window.addEventListener("pageshow", (event) => {
      if (event.persisted || performance.getEntriesByType("navigation")[0].type === "reload") {
        localStorage.removeItem("chat_id");
      }
    });
  </script>
